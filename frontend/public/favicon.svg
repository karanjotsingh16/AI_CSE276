<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nerBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="nerArrow" x1="16" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="nerRoute" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.85" />
    </linearGradient>
    <filter id="nerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#nerBg)" stroke="#1e293b" stroke-width="2" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />

  <!-- Mountain Contour Silhouette -->
  <path d="M8 50 L22 34 L32 44 L44 28 L56 50 Z" fill="#1e293b" fill-opacity="0.5" />
  <path d="M22 50 L34 38 L42 46 L50 36 L56 50 Z" fill="#0f172a" fill-opacity="0.75" />

  <!-- Terrain Route Corridor Path -->
  <path d="M14 46 Q 26 44, 32 32 T 48 16" stroke="url(#nerRoute)" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round" fill="none" />

  <!-- Directional Logistics Navigation Arrowhead -->
  <path d="M48 16 L20 27.5 L31.5 32.5 L36.5 44 Z" fill="url(#nerArrow)" filter="url(#nerGlow)" />
  <path d="M48 16 L31.5 32.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Origin & Destination Waypoint Beacons -->
  <circle cx="14" cy="46" r="3.2" fill="#0ea5e9" />
  <circle cx="14" cy="46" r="1.5" fill="#ffffff" />
  <circle cx="48" cy="16" r="3.5" fill="#10b981" />
  <circle cx="48" cy="16" r="1.6" fill="#ffffff" />
</svg>
